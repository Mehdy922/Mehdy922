<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Muhammad Mehdy, Software Engineer, Data and AI">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0221"/>
      <stop offset="0.55" stop-color="#1b0b3a"/>
      <stop offset="1" stop-color="#4a1466"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd319"/>
      <stop offset="0.5" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d9f9ff"/>
      <stop offset="1" stop-color="#22e6ff"/>
    </linearGradient>
    <linearGradient id="floorfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0221" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#0d0221" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2e97" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2e97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanband" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22e6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22e6ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22e6ff" stop-opacity="0"/>
    </linearGradient>
    <mask id="sunmask">
      <rect x="0" y="0" width="900" height="205" fill="white"/>
      <rect x="618" y="184.0" width="208" height="3.0" fill="black"/><rect x="618" y="196.5" width="208" height="4.9" fill="black"/><rect x="618" y="210.3" width="208" height="6.8" fill="black"/><rect x="618" y="225.4" width="208" height="8.7" fill="black"/><rect x="618" y="241.8" width="208" height="10.6" fill="black"/><rect x="618" y="259.5" width="208" height="12.5" fill="black"/>
    </mask>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="900" height="300" rx="14"/></clipPath>
    <style>
      .tw { animation: tw 3.2s ease-in-out infinite; }
      .halo { animation: pulse 5s ease-in-out infinite; transform-origin: 722px 178px; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .shoot { opacity: 0; animation: shoot 9s linear infinite; }
      .s2 { animation-name: shoot2; animation-duration: 13s; animation-delay: 4s; }
      .scan { animation: scan 7s linear infinite; }
      @keyframes shoot { 0% { transform: translate(120px, 18px) rotate(24deg); opacity: 0 } 2% { opacity: 0.9 } 11% { transform: translate(430px, 156px) rotate(24deg); opacity: 0 } 100% { transform: translate(430px, 156px) rotate(24deg); opacity: 0 } }
      @keyframes shoot2 { 0% { transform: translate(560px, 10px) rotate(155deg); opacity: 0 } 2% { opacity: 0.8 } 9% { transform: translate(330px, 118px) rotate(155deg); opacity: 0 } 100% { transform: translate(330px, 118px) rotate(155deg); opacity: 0 } }
      @keyframes scan { from { transform: translateY(-40px) } to { transform: translateY(300px) } }
      @keyframes tw { 0%,100% { opacity: 1 } 50% { opacity: 0.15 } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.85 } 50% { transform: scale(1.12); opacity: 1 } }
      @keyframes blink { 0%,55% { opacity: 1 } 56%,100% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .tw, .halo, .cursor { animation: none } .shoot, .scan { display: none } }
    </style>
  </defs>

