722" y1="205" x2="2432" y2="300"/><line x1="722" y1="205" x2="2527" y2="300"/><line x1="722" y1="205" x2="2622" y2="300"/><line x1="722" y1="205" x2="2717" y2="300"/><line x1="722" y1="205" x2="2812" y2="300"/><line x1="722" y1="205" x2="2907" y2="300"/><line x1="722" y1="205" x2="3002" y2="300"/><line x1="722" y1="205" x2="3097" y2="300"/><line x1="722" y1="205" x2="3192" y2="300"/><g class="gstill"><line x1="0" y1="205.8" x2="900" y2="205.8"/><line x1="0" y1="208.2" x2="900" y2="208.2"/><line x1="0" y1="212.6" x2="900" y2="212.6"/><line x1="0" y1="218.9" x2="900" y2="218.9"/><line x1="0" y1="227.2" x2="900" y2="227.2"/><line x1="0" y1="237.5" x2="900" y2="237.5"/><line x1="0" y1="249.9" x2="900" y2="249.9"/><line x1="0" y1="264.5" x2="900" y2="264.5"/><line x1="0" y1="281.1" x2="900" y2="281.1"/><line x1="0" y1="300.0" x2="900" y2="300.0"/></g><line class="gl" style="animation-delay:0.00s" x1="0" y1="205" x2="900" y2="205"/><line class="gl" style="animation-delay:-0.36s" x1="0" y1="205" x2="900" y2="205"/><line class="gl" style="animation-delay:-0.72s" x1="0" y1="205" x2="900" y2="205"/><line class="gl" style="animation-delay:-1.08s" x1="0" y1="205" x2="900" y2="205"/><line class="gl" style="animation-delay:-1.44s" x1="0" y1="205" x2="900" y2="205"/><line class="gl" style="animation-delay:-1.80s" x1="0" y1="205" x2="900" y2="205"/><line class="gl" style="animation-delay:-2.16s" x1="0" y1="205" x2="900" y2="205"/><line class="gl" style="animation-delay:-2.52s" x1="0" y1="205" x2="900" y2="205"/><line class="gl" style="animation-delay:-2.88s" x1="0" y1="205" x2="900" y2="205"/><line class="gl" style="animation-delay:-3.24s" x1="0" y1="205" x2="900" y2="205"/></g>
