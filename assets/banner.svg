    <g fill="#ffffff" opacity="0.8"><circle class="tw" style="animation-delay:0s" cx="31" cy="13" r="1.5"/><circle cx="228" cy="84" r="0.7"/><circle cx="425" cy="155" r="0.7"/><circle cx="622" cy="51" r="1.1"/><circle class="tw" style="animation-delay:1.6s" cx="819" cy="122" r="0.7"/><circle cx="116" cy="18" r="0.7"/><circle cx="313" cy="89" r="1.1"/><circle cx="510" cy="160" r="1.5"/><circle class="tw" style="animation-delay:3.2s" cx="707" cy="56" r="0.7"/><circle cx="4" cy="127" r="1.1"/><circle cx="201" cy="23" r="0.7"/><circle cx="398" cy="94" r="0.7"/><circle class="tw" style="animation-delay:1.2000000000000002s" cx="595" cy="165" r="1.1"/><circle cx="792" cy="61" r="0.7"/><circle cx="89" cy="132" r="1.5"/><circle cx="286" cy="28" r="1.1"/><circle class="tw" style="animation-delay:2.8000000000000003s" cx="483" cy="99" r="0.7"/><circle cx="680" cy="170" r="0.7"/><circle cx="877" cy="66" r="1.1"/><circle cx="174" cy="137" r="0.7"/><circle class="tw" style="animation-delay:0.8s" cx="371" cy="33" r="0.7"/><circle cx="568" cy="104" r="1.5"/><circle cx="765" cy="0" r="0.7"/><circle cx="62" cy="71" r="0.7"/><circle class="tw" style="animation-delay:2.4000000000000004s" cx="259" cy="142" r="1.1"/><circle cx="456" cy="38" r="0.7"/><circle cx="653" cy="109" r="0.7"/><circle cx="850" cy="5" r="1.1"/><circle class="tw" style="animation-delay:0.4s" cx="147" cy="76" r="1.5"/><circle cx="344" cy="147" r="0.7"/><circle cx="541" cy="43" r="1.1"/><circle cx="738" cy="114" r="0.7"/><circle class="tw" style="animation-delay:2s" cx="35" cy="10" r="0.7"/><circle cx="232" cy="81" r="1.1"/><circle cx="429" cy="152" r="0.7"/><circle cx="626" cy="48" r="1.5"/><circle class="tw" style="animation-delay:0s" cx="823" cy="119" r="1.1"/><circle cx="120" cy="15" r="0.7"/><circle cx="317" cy="86" r="0.7"/><circle cx="514" cy="157" r="1.1"/><circle class="tw" style="animation-delay:1.6s" cx="711" cy="53" r="0.7"/><circle cx="8" cy="124" r="0.7"/><circle cx="205" cy="20" r="1.5"/><circle cx="402" cy="91" r="0.7"/><circle class="tw" style="animation-delay:3.2s" cx="599" cy="162" r="0.7"/><circle cx="796" cy="58" r="1.1"/></g>

    <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round">
      <line class="shoot" x1="0" y1="0" x2="46" y2="0"/>
      <line class="shoot s2" x1="0" y1="0" x2="34" y2="0"/>
    </g>
    <rect class="scan" x="0" y="0" width="900" height="40" fill="url(#scanband)"/>

    <circle class="halo" cx="722" cy="178" r="166" fill="url(#halo)"/>
    <circle cx="722" cy="178" r="104" fill="url(#sun)" mask="url(#sunmask)"/>

