<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" role="img" aria-label="Thanks for stopping by">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0221" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d0221"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="900" height="120" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="120" fill="#0d0221"/>
    <style>
      .gl { animation: flow 3.6s cubic-bezier(0.55, 0, 1, 0.5) infinite, rise 3.6s linear infinite; }
      .gstill { display: none; }
      @keyframes flow { from { transform: translateY(0) } to { transform: translateY(102px) } }
      @keyframes rise { 0% { opacity: 0 } 18%, 100% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .gl { display: none } .gstill { display: inline } }
    </style>
