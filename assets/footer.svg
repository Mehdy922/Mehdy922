="450" y1="18" x2="2255" y2="120"/><line x1="450" y1="18" x2="2350" y2="120"/><line x1="450" y1="18" x2="2445" y2="120"/><line x1="450" y1="18" x2="2540" y2="120"/><line x1="450" y1="18" x2="2635" y2="120"/><line x1="450" y1="18" x2="2730" y2="120"/><line x1="450" y1="18" x2="2825" y2="120"/><line x1="450" y1="18" x2="2920" y2="120"/><g class="gstill"><line x1="0" y1="19.3" x2="900" y2="19.3"/><line x1="0" y1="23.5" x2="900" y2="23.5"/><line x1="0" y1="31.0" x2="900" y2="31.0"/><line x1="0" y1="41.8" x2="900" y2="41.8"/><line x1="0" y1="56.0" x2="900" y2="56.0"/><line x1="0" y1="73.7" x2="900" y2="73.7"/><line x1="0" y1="95.1" x2="900" y2="95.1"/><line x1="0" y1="120.0" x2="900" y2="120.0"/></g><line class="gl" style="animation-delay:0.00s" x1="0" y1="18" x2="900" y2="18"/><line class="gl" style="animation-delay:-0.45s" x1="0" y1="18" x2="900" y2="18"/><line class="gl" style="animation-delay:-0.90s" x1="0" y1="18" x2="900" y2="18"/><line class="gl" style="animation-delay:-1.35s" x1="0" y1="18" x2="900" y2="18"/><line class="gl" style="animation-delay:-1.80s" x1="0" y1="18" x2="900" y2="18"/><line class="gl" style="animation-delay:-2.25s" x1="0" y1="18" x2="900" y2="18"/><line class="gl" style="animation-delay:-2.70s" x1="0" y1="18" x2="900" y2="18"/><line class="gl" style="animation-delay:-3.15s" x1="0" y1="18" x2="900" y2="18"/></g>
    <rect width="900" height="120" fill="url(#fade)"/>
    <line x1="0" y1="18" x2="900" y2="18" stroke="#22e6ff" stroke-width="2" filter="url(#glow)"/>
    <rect x="300" y="50" width="300" height="40" rx="20" fill="#0d0221" fill-opacity="0.85" stroke="#ff2e97" stroke-opacity="0.8"/>
    <text x="450" y="75" text-anchor="middle" font-family="'Cascadia Code','SF Mono','JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" letter-spacing="1.5" fill="#f1ecff">THANKS FOR STOPPING BY</text>
