  <text x="22" y="97" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#cbc3ee">Teams draw on their phones, train a tiny neural</text><text x="22" y="115" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#cbc3ee">network in the browser, then watch it fail on other</text><text x="22" y="133" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#cbc3ee">teams' drawings. Lesson two: cross-examine chatbots</text><text x="22" y="151" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#cbc3ee">they trained.</text>
